[project]
name = "arxiv-daily"
version = "0.1.0"
description = "Fetch arXiv papers for configurable interests, summarize them with an AI provider, and publish Markdown plus RSS output."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.3.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_ai_rss"]
